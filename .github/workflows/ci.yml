name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Windows runner 的 Python stdout 默认是 cp1252，构建脚本打印中文路径
# （dist/示例文档.md）会 UnicodeEncodeError 直接让构建挂掉。
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  verify:
    name: 语法检查 + 单文件构建 + 便携版/主题回归
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: JS 语法检查
        shell: bash
        run: |
          node --check MDReader/src/app.js
          node --check MDReader/desktop/main.js
          node --check MDReader/desktop/preload.js

      - name: 构建单文件 HTML（中英文两版）
        shell: bash
        run: |
          python MDReader/src/gen-demo.py
          python MDReader/src/build.py
          python MDReader/src/build.py --edition global --out MDReader/dist-intl/MDReader.html

      - name: 同步进桌面壳
        shell: bash
        run: python MDReader/desktop/scripts/sync-app.py

      # 生成物漂移是这类仓库最隐蔽的坑：产物已提交、源码又改了，仓库里就躺着一份旧界面。
      # 这里做两道校验：① 提交的 dist 必须与本次构建完全一致；② 桌面壳副本必须与 dist 字节一致。
      - name: 生成物漂移检查
        shell: bash
        run: |
          dirty=$(git status --porcelain -- MDReader/dist MDReader/dist-intl MDReader/src/app.js)
          if [ -n "$dirty" ]; then
            echo "::error::提交的产物与重建结果不一致：$(echo "$dirty" | tr '\n' ' ' | cut -c1-300)"
            echo "--- numstat ---"
            git diff --numstat -- MDReader/dist MDReader/dist-intl MDReader/src/app.js
            exit 1
          fi
          # 国际版必须只差默认语言一行，多一行都说明两条构建链分叉了
          n=$(git diff --no-index --numstat -- MDReader/dist/MDReader.html MDReader/dist-intl/MDReader.html | awk '{print $1+$2}')
          if [ "${n:-0}" -gt 2 ]; then
            echo "::error::dist 与 dist-intl 差异 $n 行（预期 2 行，仅默认语言）。"
            exit 1
          fi
          for f in "MDReader.html" "示例文档.md" "使用说明.md"; do
            a="MDReader/dist/$f"
            b="MDReader/desktop/app/$f"
            if [ ! -f "$b" ]; then
              echo "::error::桌面壳缺少 $b（sync-app.py 未同步该文件）"
              exit 1
            fi
            if ! cmp -s "$a" "$b"; then
              echo "::error::$f 在 dist 与 desktop/app 之间不一致（字节数 $(wc -c < "$a") vs $(wc -c < "$b")）"
              exit 1
            fi
          done
          echo "生成物与提交内容一致（dist + desktop/app）"

      - name: 校验内嵌依赖完整
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          h = Path('MDReader/dist/MDReader.html').read_text(encoding='utf-8')
          assert 'marked.js v15' in h, 'marked 未内嵌'
          assert 'highlight.js v11' in h, 'hljs 未内嵌'
          assert 'mermaid v10' in h, 'mermaid 未内嵌'
          assert 'MD Reader v1.7' in h, '版本号缺失'
          assert 'id="btnRecent"' in h, '最近打开控件缺失'
          assert '__MD_DESKTOP__' in h, '桌面桥缺失'
          print('单文件校验通过: %.2f MB' % (len(h.encode()) / 1024 / 1024))
          PY

      - name: 打包便携版
        shell: bash
        run: python MDReader/tools/pack-portable.py

      - name: 便携版 17 项回归（无头 Edge）
        shell: bash
        run: python MDReader/desktop/scripts/verify-portable.py

      - name: 主题矩阵 11 项回归（护眼不被皮肤覆盖）
        shell: bash
        run: python MDReader/desktop/scripts/verify-themes.py

      - uses: actions/upload-artifact@v4
        with:
          name: MDReader-portable
          path: 发布包/MDReader-便携版-v*.zip

  build-ios-pwa:
    name: 构建 iOS 主屏幕 PWA 包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 安装 Pillow 并生成 PWA
        shell: bash
        run: |
          pip install pillow
          python MDReader/src/build.py
          python MDReader/ios/build-pwa.py
      - name: 校验注入结果
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          h = Path('MDReader/ios/site/index.html').read_text(encoding='utf-8')
          assert 'rel="manifest"' in h and 'apple-touch-icon' in h, 'PWA 标签缺失'
          assert 'MD Reader v1.7' in h, '阅读器版本缺失'
          print('PWA 校验通过')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MDReader-iOS-PWA
          path: 发布包/MDReader-iOS-PWA-v*.zip

  build-mac:
    name: 构建 macOS dmg（手动触发）
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 安装依赖并构建
        working-directory: MDReader/desktop
        run: |
          npm install --no-audit --no-fund
          npm run sync
          npm run build:mac
      - uses: actions/upload-artifact@v4
        with:
          name: MDReader-mac-dmg
          path: MDReader/desktop/release/*.dmg
